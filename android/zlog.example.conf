# Optional override: copy beside nfsu1x_env.txt, not into logs/.
# This file replaces the generated rules, so RECOMP_LOG_*_LEVEL no longer applies.
[global]
strict init = true
use_writer_thread = false
buffer min = 4KB
buffer max = 2MB
file perms = 644
rotate lock file = logs/.zlog.lock

[levels]
TRACE = 10, LOG_DEBUG
OFF = 254, LOG_EMERG

[formats]
standard = "%d(%F %T).%ms %-6V [%c] [tid:%k] %f:%L %m%n"

[rules]
system.INFO "logs/system.log", 8MB * 3 ~ "logs/system.%d(%Y-%m-%d).#r.log"; standard
system.INFO "logs/all.log", 32MB * 3 ~ "logs/all.%d(%Y-%m-%d).#r.log"; standard
system.INFO "nfsu1.log"; standard
input.TRACE "logs/input.log", 8MB * 3 ~ "logs/input.%d(%Y-%m-%d).#r.log"; standard
input.TRACE "logs/all.log", 32MB * 3 ~ "logs/all.%d(%Y-%m-%d).#r.log"; standard
input.TRACE "nfsu1.log"; standard
graphics.INFO "logs/graphics.log", 8MB * 3 ~ "logs/graphics.%d(%Y-%m-%d).#r.log"; standard
graphics.INFO "logs/all.log", 32MB * 3 ~ "logs/all.%d(%Y-%m-%d).#r.log"; standard
graphics.INFO "nfsu1.log"; standard
audio.INFO "logs/audio.log", 8MB * 3 ~ "logs/audio.%d(%Y-%m-%d).#r.log"; standard
audio.INFO "logs/all.log", 32MB * 3 ~ "logs/all.%d(%Y-%m-%d).#r.log"; standard
audio.INFO "nfsu1.log"; standard
files.INFO "logs/files.log", 8MB * 3 ~ "logs/files.%d(%Y-%m-%d).#r.log"; standard
files.INFO "logs/all.log", 32MB * 3 ~ "logs/all.%d(%Y-%m-%d).#r.log"; standard
files.INFO "nfsu1.log"; standard
runtime.INFO "logs/runtime.log", 8MB * 3 ~ "logs/runtime.%d(%Y-%m-%d).#r.log"; standard
runtime.INFO "logs/all.log", 32MB * 3 ~ "logs/all.%d(%Y-%m-%d).#r.log"; standard
runtime.INFO "nfsu1.log"; standard
performance.INFO "logs/performance.log", 8MB * 3 ~ "logs/performance.%d(%Y-%m-%d).#r.log"; standard
performance.INFO "logs/all.log", 32MB * 3 ~ "logs/all.%d(%Y-%m-%d).#r.log"; standard
performance.INFO "nfsu1.log"; standard
kernel.INFO "logs/kernel.log", 8MB * 3 ~ "logs/kernel.%d(%Y-%m-%d).#r.log"; standard
kernel.INFO "logs/all.log", 32MB * 3 ~ "logs/all.%d(%Y-%m-%d).#r.log"; standard
kernel.INFO "nfsu1.log"; standard
